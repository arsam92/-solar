<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منظومه شمسی — نسخه حرفه‌ای</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #000; font-family: Tahoma, sans-serif; }
  canvas { display: block; }
  .glass {
    background: rgba(0,0,0,0.78);
    border: 1px solid rgba(79,195,247,0.3);
    backdrop-filter: blur(12px);
    border-radius: 12px; color: #fff;
  }
  #topBar {
    position: fixed; top: 12px; right: 12px;
    display: flex; gap: 8px; flex-wrap: wrap;
    z-index: 100; max-width: 70vw;
  }
  #info { padding: 10px 16px; font-size: 13px; line-height: 1.7; }
  #info b { color: #4fc3f7; }
  #info small { color: #aaa; font-size: 11px; }
  #dateBox {
    padding: 10px 16px; font-size: 12px;
    color: #4fc3f7; text-align: center; line-height: 1.6;
  }
  #dateBox b { color: #fff; display: block; font-size: 14px; }
  #searchBox {
    position: fixed; top: 12px; left: 12px;
    padding: 8px 12px; z-index: 100;
    display: flex; gap: 8px; align-items: center;
  }
  #searchBox input {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(79,195,247,0.4);
    color: #fff; padding: 6px 10px;
    border-radius: 8px; font-family: Tahoma;
    font-size: 13px; width: 140px; outline: none;
  }
  button.sm {
    background: rgba(79,195,247,0.15);
    color: #4fc3f7; border: 1px solid #4fc3f7;
    padding: 6px 11px; border-radius: 8px;
    cursor: pointer; font-family: Tahoma;
    font-size: 11px; white-space: nowrap;
    transition: all 0.15s;
  }
  button.sm:hover { background: #4fc3f7; color: #000; }
  button.sm.active { background: #4fc3f7; color: #000; }
  #timeBar {
    position: fixed; bottom: 12px; left: 12px;
    padding: 10px 14px; min-width: 240px;
    z-index: 100; font-size: 12px;
  }
  #timeBar label { color: #4fc3f7; font-weight: bold; }
  #speedSlider {
    width: 100%; margin-top: 6px;
    -webkit-appearance: none; height: 5px;
    border-radius: 3px; background: rgba(79,195,247,0.3);
    outline: none;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #4fc3f7;
    cursor: pointer; box-shadow: 0 0 10px #4fc3f7;
  }
  #speedValue { color: #4fc3f7; font-weight: bold; }
  #controls {
    position: fixed; bottom: 12px; right: 12px;
    padding: 8px 12px; z-index: 100;
    display: flex; gap: 6px; flex-wrap: wrap;
    max-width: 68vw;
  }
  .label {
    color: #fff; font-family: Tahoma, sans-serif;
    font-size: 12px; font-weight: bold;
    text-shadow: 0 0 10px rgba(79,195,247,0.9), 0 0 20px rgba(79,195,247,0.5);
    background: rgba(0,0,0,0.4);
    padding: 2px 8px; border-radius: 5px;
    pointer-events: none; white-space: nowrap;
  }
  .label.dwarf { color: #bbaaff; font-size: 11px; }
  .label.moon { color: #88ddff; font-size: 10px; }
  .label.probe { color: #ffcc44; font-size: 10px; }
  .label.special { color: #ff88ff; font-size: 11px; }
  .label.star { color: #ffe68a; font-size: 10px; }
  #planetInfo {
    position: fixed; top: 50%; left: 20px;
    transform: translateY(-50%) translateX(-120%);
    width: 340px; max-height: 80vh; overflow-y: auto;
    background: rgba(10,15,30,0.95);
    border: 1px solid rgba(79,195,247,0.5);
    border-radius: 16px; padding: 22px;
    z-index: 200; backdrop-filter: blur(15px);
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 20px 60px rgba(79,195,247,0.2);
  }
  #planetInfo.open { transform: translateY(-50%) translateX(0); }
  #planetInfo .p-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(79,195,247,0.2);
  }
  #planetInfo .p-color {
    width: 44px; height: 44px; border-radius: 50%;
    box-shadow: 0 0 20px currentColor; flex-shrink: 0;
  }
  #planetInfo .p-name { color: #fff; font-size: 22px; font-weight: bold; }
  #planetInfo .p-name small {
    display: block; color: #4fc3f7;
    font-size: 12px; font-weight: normal; margin-top: 3px;
  }
  #planetInfo .p-row {
    display: flex; justify-content: space-between;
    padding: 7px 0; color: #ccc; font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 10px;
  }
  #planetInfo .p-row:last-child { border-bottom: none; }
  #planetInfo .p-row .k { color: #888; flex-shrink: 0; }
  #planetInfo .p-row .v { color: #4fc3f7; font-weight: bold; text-align: left; }
  #planetInfo .p-fact {
    margin-top: 12px; padding: 10px 14px;
    background: rgba(79,195,247,0.08);
    border-left: 3px solid #4fc3f7;
    border-radius: 8px; font-size: 12px;
    color: #aaccee; line-height: 1.8;
  }
  #planetInfo .p-buttons { display: flex; gap: 8px; margin-top: 14px; }
  #planetInfo .p-buttons button {
    flex: 1; padding: 8px 12px;
    background: rgba(79,195,247,0.15);
    color: #4fc3f7; border: 1px solid #4fc3f7;
    border-radius: 8px; cursor: pointer;
    font-family: Tahoma; font-size: 12px;
  }
  #planetInfo .p-buttons button:hover { background: #4fc3f7; color: #000; }
  #planetInfo .p-buttons button.active { background: #4fc3f7; color: #000; }
  #planetInfo .p-close {
    position: absolute; top: 12px; left: 12px;
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,80,80,0.2);
    color: #ff5050; border: 1px solid #ff5050;
    cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  #hint {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: #888; font-size: 11px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid rgba(79,195,247,0.15);
    z-index: 99; pointer-events: none;
  }
  #achievements {
    position: fixed; top: 12px; right: 12px;
    width: 240px; padding: 12px 16px;
    z-index: 150; font-size: 12px; display: none;
  }
  #achievements.open { display: block; }
  #achievements h3 {
    color: #ffcc44; font-size: 14px;
    margin: 0 0 10px;
    display: flex; justify-content: space-between;
  }
  #achievements .ach {
    padding: 6px 10px; margin: 4px 0;
    background: rgba(255,204,68,0.1);
    border-left: 3px solid #ffcc44;
    border-radius: 6px;
    color: #ffdd88; font-size: 11px;
  }
  #achievements .ach.locked { opacity: 0.3; border-left-color: #666; color: #888; }
  .ach-toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ffcc44, #ff9900);
    color: #000; padding: 14px 28px;
    border-radius: 12px; font-weight: bold; font-size: 15px;
    box-shadow: 0 10px 40px rgba(255,204,68,0.5);
    z-index: 300;
    animation: achIn 0.5s ease, achOut 0.5s ease 3s forwards;
    pointer-events: none;
  }
  @keyframes achIn { from { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.8); } }
  @keyframes achOut { to { opacity: 0; transform: translateX(-50%) translateY(-30px); } }
  #sizeCompare {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 250; display: none;
    padding: 40px; overflow-y: auto;
  }
  #sizeCompare.open { display: block; }
  #sizeCompare h2 { color: #4fc3f7; text-align: center; font-size: 22px; margin-bottom: 30px; }
  #sizeCompare .row {
    display: flex; align-items: flex-end;
    justify-content: center; gap: 40px;
    flex-wrap: wrap; margin-bottom: 30px;
    padding: 20px; border-bottom: 1px solid rgba(79,195,247,0.2);
  }
  #sizeCompare .body { text-align: center; color: #fff; }
  #sizeCompare .circle {
    border-radius: 50%; margin: 0 auto 10px;
    box-shadow: 0 0 30px currentColor;
  }
  #sizeCompare .name { font-size: 13px; font-weight: bold; }
  #sizeCompare .dim { font-size: 10px; color: #888; margin-top: 3px; }
  .modal-close {
    position: fixed; top: 20px; right: 20px;
    width: 40px; height: 40px;
    background: rgba(255,80,80,0.2);
    color: #ff5050; border: 1px solid #ff5050;
    border-radius: 10px; cursor: pointer; font-size: 20px;
    z-index: 260;
  }
  #quiz {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 250; display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #quiz.open { display: flex; }
  .quiz-box {
    width: min(520px, 100%);
    background: rgba(10,15,30,0.98);
    border: 1px solid rgba(79,195,247,0.5);
    border-radius: 20px; padding: 30px;
    box-shadow: 0 20px 80px rgba(79,195,247,0.3);
  }
  .quiz-box h2 { color: #4fc3f7; margin: 0 0 20px; font-size: 20px; }
  .quiz-q { color: #fff; font-size: 16px; margin-bottom: 18px; line-height: 1.7; }
  .quiz-opt {
    display: block; width: 100%;
    padding: 12px 18px; margin-bottom: 10px;
    background: rgba(79,195,247,0.1);
    color: #fff; border: 1px solid rgba(79,195,247,0.3);
    border-radius: 10px; cursor: pointer;
    font-family: Tahoma; font-size: 14px;
    text-align: right; transition: all 0.15s;
  }
  .quiz-opt:hover { background: rgba(79,195,247,0.25); }
  .quiz-opt.correct { background: rgba(80,255,120,0.3); border-color: #50ff78; }
  .quiz-opt.wrong { background: rgba(255,80,80,0.3); border-color: #ff5050; }
  .quiz-progress { color: #888; font-size: 12px; margin-top: 12px; }
  .quiz-result { color: #ffcc44; font-size: 18px; text-align: center; line-height: 1.8; }
  #timeTravel {
    position: fixed; top: 60px; left: 12px;
    padding: 12px 16px; z-index: 150;
    display: none; min-width: 240px;
  }
  #timeTravel.open { display: block; }
  #timeTravel label { color: #4fc3f7; font-weight: bold; font-size: 12px; }
  #timeTravel input {
    width: 100%; margin-top: 8px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(79,195,247,0.4);
    color: #fff; border-radius: 8px;
    font-family: Tahoma; font-size: 12px;
  }
  #timeTravel .presets {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .tour-banner {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%);
    background: rgba(79,195,247,0.9);
    color: #000; padding: 10px 24px;
    border-radius: 10px; font-weight: bold;
    z-index: 150; font-size: 14px;
    display: none;
    box-shadow: 0 8px 30px rgba(79,195,247,0.4);
  }
  .tour-banner.open { display: block; }
  .tour-banner button {
    margin-right: 12px; padding: 4px 10px;
    background: rgba(0,0,0,0.3); color: #fff;
    border: none; border-radius: 6px;
    cursor: pointer; font-size: 12px;
    font-family: Tahoma;
  }
  /* HUD برای دید اول‌شخص */
  .hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 90;
    display: none;
  }
  .hud.on { display: block; }
  .hud::before, .hud::after {
    content: ''; position: absolute;
    background: rgba(79,195,247,0.5);
  }
  .hud::before {
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 4px; height: 4px; border-radius: 50%;
  }
  /* پنل ستاره‌های نزدیک */
  #starsPanel {
    position: fixed; top: 50%; right: 20px;
    transform: translateY(-50%) translateX(120%);
    width: 300px; max-height: 75vh; overflow-y: auto;
    background: rgba(10,15,30,0.95);
    border: 1px solid rgba(255,230,138,0.5);
    border-radius: 16px; padding: 20px;
    z-index: 200; backdrop-filter: blur(15px);
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #starsPanel.open { transform: translateY(-50%) translateX(0); }
  #starsPanel h3 { color: #ffe68a; margin: 0 0 14px; font-size: 16px; }
  #starsPanel .star {
    padding: 8px 12px; margin-bottom: 6px;
    background: rgba(255,230,138,0.08);
    border-left: 3px solid #ffe68a;
    border-radius: 8px; color: #ddd;
    font-size: 12px;
  }
  #starsPanel .star b { color: #ffe68a; }
  #starsPanel .star small { color: #888; font-size: 10.5px; display: block; margin-top: 2px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.4); border-radius: 3px; }
</style>
</head>
<body>

<div id="topBar">
  <div id="info" class="glass">
    🌌 <b>منظومه شمسی</b><br>
    <small>🖱️ بکش: چرخش | 🎡 اسکرول: زوم | 👆 کلیک: اطلاعات</small>
  </div>
  <div id="dateBox" class="glass">
    <b id="dateVal"></b>
    <span id="timeVal"></span>
  </div>
</div>

<div id="searchBox" class="glass">
  <input id="searchInput" placeholder="جستجو...">
  <button class="sm" id="searchBtn">🔍</button>
</div>

<div id="timeTravel" class="glass">
  <label>⏰ سفر در زمان</label>
  <input id="yearInput" type="number" value="2026" min="1900" max="2200">
  <div class="presets">
    <button class="sm" data-year="1969">۱۹۶۹</button>
    <button class="sm" data-year="1977">۱۹۷۷</button>
    <button class="sm" data-year="2026">اکنون</button>
    <button class="sm" data-year="2061">۲۰۶۱</button>
  </div>
</div>

<div id="starsPanel" class="glass">
  <h3>⭐ ستاره‌های نزدیک</h3>
  <div id="starsList"></div>
</div>

<div id="achievements" class="glass">
  <h3>🏆 دستاوردها <span id="achCount">0/12</span></h3>
  <div id="achList"></div>
</div>

<div class="tour-banner" id="tourBanner">
  <span id="tourText"></span>
  <button id="tourStop">توقف</button>
</div>

<div class="hud" id="hud">
  <div style="position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#4fc3f7;font-family:Tahoma;font-size:12px;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:8px">
    حالت اول‌شخص — با WASD حرکت کن، با موس بچرخ
  </div>
</div>

<div id="timeBar" class="glass">
  <label>⏱️ سرعت: <span id="speedValue">1.0x</span></label>
  <input type="range" id="speedSlider" min="0" max="50" value="10">
</div>

<div id="controls">
  <button class="sm" id="btnLabels">📝 نام‌ها</button>
  <button class="sm" id="btnOrbits">⭕ مدارها</button>
  <button class="sm" id="btnConstellations">✨ فلکی</button>
  <button class="sm" id="btnTrails">💫 دنباله</button>
  <button class="sm" id="btnHabitable">🌱 کمربند حیات</button>
  <button class="sm" id="btnNearbyStars">⭐ ستاره‌ها</button>
  <button class="sm" id="btnTour">🎥 تور</button>
  <button class="sm" id="btnTravel">⏰ زمان</button>
  <button class="sm" id="btnCompare">📏 اندازه</button>
  <button class="sm" id="btnAge">🧮 سن</button>
  <button class="sm" id="btnQuiz">🎓 آزمون</button>
  <button class="sm" id="btnShot">📸</button>
  <button class="sm" id="btnFPS">👁️ اول‌شخص</button>
  <button class="sm" id="btnSave">💾 ذخیره</button>
  <button class="sm" id="btnLoad">📂 بارگذاری</button>
  <button class="sm" id="btnSunView">☀️</button>
  <button class="sm" id="btnAch">🏆</button>
  <button class="sm" id="btnReset">🔄</button>
</div>

<div id="hint">💡 روی هر جرم <b>کلیک کن</b></div>

<div id="planetInfo">
  <button class="p-close" id="piClose">✕</button>
  <div class="p-header">
    <div class="p-color" id="piColor"></div>
    <div class="p-name">
      <span id="piName"></span>
      <small id="piEnglish"></small>
    </div>
  </div>
  <div class="p-row"><span class="k">قطر</span><span class="v" id="piDiameter"></span></div>
  <div class="p-row"><span class="k">فاصله از خورشید</span><span class="v" id="piDistance"></span></div>
  <div class="p-row"><span class="k">مدت یک سال</span><span class="v" id="piYear"></span></div>
  <div class="p-row"><span class="k">مدت یک روز</span><span class="v" id="piDay"></span></div>
  <div class="p-row"><span class="k">تعداد قمرها</span><span class="v" id="piMoons"></span></div>
  <div class="p-row"><span class="k">دما</span><span class="v" id="piTemp"></span></div>
  <div class="p-row"><span class="k">جاذبه</span><span class="v" id="piGravity"></span></div>
  <div class="p-fact" id="piFact"></div>
  <div class="p-buttons">
    <button id="piFollow">🎯 دنبال</button>
    <button id="piZoom">🔍 نزدیک</button>
  </div>
</div>

<div id="sizeCompare">
  <button class="modal-close" id="scClose">✕</button>
  <h2>📏 مقایسه اندازه اجرام</h2>
  <div id="scContent"></div>
</div>

<div id="quiz">
  <button class="modal-close" id="quizClose">✕</button>
  <div class="quiz-box" id="quizBox"></div>
</div>

<div id="ageCalc" class="glass" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:250;padding:24px;width:340px">
  <h3 style="color:#4fc3f7;margin:0 0 14px">🧮 محاسبه‌گر سن سیارات</h3>
  <label style="color:#aaa;font-size:12px">سن شما به سال زمینی:</label>
  <input id="ageInput" type="number" value="13" style="width:100%;margin:8px 0 14px;padding:8px;background:rgba(0,0,0,0.5);border:1px solid rgba(79,195,247,0.4);color:#fff;border-radius:8px;font-family:Tahoma">
  <div id="ageResults"></div>
  <button class="sm" id="ageClose" style="width:100%;margin-top:12px;padding:10px">بستن</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script>
'use strict';

// ============================================================
//   داده‌های دقیق سیارات
// ============================================================
const PLANETS = [
  { name:'عطارد', en:'Mercury', color:0x8c8278, glow:0xa89a8a, size:0.38, dist:6, speed:0.025, tilt:0.001, realR:2440,
    diameter:'۴,۸۷۹ کیلومتر', distance:'۵۷.۹ م.ک', year:'۸۸ روز', day:'۵۹ روز', moons:'۰', temp:'−۱۷۳ تا ۴۲۷°', gravity:'۳.۷',
    fact:'کوچک‌ترین سیاره و نزدیک‌ترین به خورشیده. سطحش پر از دهانه‌های برخوردیه.' },
  { name:'زهره', en:'Venus', color:0xe8c97a, glow:0xffe6a8, size:0.55, dist:8.5, speed:0.018, tilt:3.096, realR:6052,
    diameter:'۱۲,۱۰۴ کیلومتر', distance:'۱۰۸.۲ م.ک', year:'۲۲۵ روز', day:'۲۴۳ روز', moons:'۰', temp:'۴۶۴°', gravity:'۸.۹',
    fact:'داغ‌ترین سیاره با ابرهای اسیدی. مثل کوره‌ای زیر فشار ۹۰ اتمسفر.' },

function noise(x, y, seed) {
  // نویز شبه‌تصادفی
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
  return n - Math.floor(n);
}

function fbm(x, y, oct, seed) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) {
    const xi = Math.floor(x * f), yi = Math.floor(y * f);
    const xf = x * f - xi, yf = y * f - yi;
    const u = xf*xf*(3-2*xf), vv = yf*yf*(3-2*yf);
    const a00 = noise(xi, yi, seed);
    const a10 = noise(xi+1, yi, seed);
    const a01 = noise(xi, yi+1, seed);
    const a11 = noise(xi+1, yi+1, seed);
    v += a * ((a00*(1-u)+a10*u)*(1-vv) + (a01*(1-u)+a11*u)*vv);
    a *= 0.5; f *= 2;
  }
  return v;
}

function makeRockyTexture(baseColor, variation, type) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  const r0 = (baseColor >> 16) & 255, g0 = (baseColor >> 8) & 255, b0 = baseColor & 255;
  const img = x.createImageData(1024, 512);
  const d = img.data;

  for (let j = 0; j < 512; j++) {
    for (let i = 0; i < 1024; i++) {
      const u = i / 1024, v = j / 512;
      let n = fbm(u * 6, v * 6, 6, 1234) * variation;
      if (type === 'mercury' || type === 'moon') {
        // دهانه‌های برخوردی
        const crater = fbm(u * 20, v * 20, 3, 5678);
        if (crater > 0.75) n -= 0.35;
        if (crater < 0.25) n += 0.15;
      }
      const f = 1 + n;
      const idx = (j * 1024 + i) * 4;
      d[idx]     = Math.max(0, Math.min(255, r0 * f));
      d[idx + 1] = Math.max(0, Math.min(255, g0 * f));
      d[idx + 2] = Math.max(0, Math.min(255, b0 * f));
      d[idx + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 16;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

function makeEarthTexture() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 1024;
  const x = c.getContext('2d');
  // اقیانوس با عمق متغیر
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#0a2a5e');
  g.addColorStop(0.5, '#1a4a8a');
  g.addColorStop(1, '#0a2a5e');
  x.fillStyle = g;
  x.fillRect(0, 0, 2048, 1024);

  // قاره‌ها با نویز
  const img = x.getImageData(0, 0, 2048, 1024);
  const d = img.data;
  for (let j = 0; j < 1024; j++) {
    for (let i = 0; i < 2048; i++) {
      const u = i / 2048, v = j / 1024;
      // نویز برای قاره
      let land = fbm(u * 4, v * 4, 7, 111);
      // ارتفاع: قطب‌ها + نویز
      const latFactor = Math.abs(v - 0.5) * 2;
      land += latFactor * 0.1;

      const idx = (j * 2048 + i) * 4;
      if (land > 0.52) {
        // خشکی
        const green = land * 0.9;
        d[idx]     = 30 + Math.floor((land - 0.52) * 200);
        d[idx + 1] = 70 + Math.floor(green * 120);
        d[idx + 2] = 20 + Math.floor((1 - land) * 50);
        // بیابان
        if (land > 0.6 && latFactor > 0.2 && latFactor < 0.55) {
          d[idx]     = 180 + Math.floor(Math.random() * 30);
          d[idx + 1] = 150 + Math.floor(Math.random() * 30);
          d[idx + 2] = 90;
        }
        // قطب یخ
        if (latFactor > 0.85) {
          d[idx] = 230; d[idx+1] = 240; d[idx+2] = 250;
        }
      } else if (land > 0.48) {
        // ساحل
        d[idx]     = 20 + Math.floor(land * 40);
        d[idx + 1] = 90 + Math.floor(land * 40);
        d[idx + 2] = 130 + Math.floor(land * 50);
      } else {
        // اقیانوس عمیق
        const depth = (0.48 - land) / 0.48;
        d[idx]     = 10 + Math.floor((1 - depth) * 30);
        d[idx + 1] = 40 + Math.floor((1 - depth) * 60);
        d[idx + 2] = 80 + Math.floor((1 - depth) * 80);
      }
      d[idx + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 16;
  return t;
}

function makeGasGiantTexture(baseColor, bands, spot) {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 1024;
  const x = c.getContext('2d');
  const r0 = (baseColor >> 16) & 255, g0 = (baseColor >> 8) & 255, b0 = baseColor & 255;

  for (let j = 0; j < 1024; j++) {
    const v = j / 1024;
    // نوارها
    let band = Math.sin(v * bands * Math.PI) * 0.15;
    band += fbm(0, v * 20, 4, 99) * 0.12 - 0.06;
    // نویز در طول جغرافیایی
    for (let i = 0; i < 2048; i++) {
      const u = i / 2048;
      const turb = fbm(u * 12, v * 30, 4, 777) * 0.1 - 0.05;
      const f = 1 + band + turb;
      const idx = (j * 2048 + i) * 4;
      d_set(x, i, j, r0 * f, g0 * f, b0 * f);
    }
  }
  function d_set(ctx, i, j, r, g, b) {
    ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
    ctx.fillRect(i, j, 1, 1);
  }
  // لکه سرخ مشتری
  if (spot) {
    const grd = x.createRadialGradient(1500, 620, 20, 1500, 620, 140);
    grd.addColorStop(0, 'rgba(180,60,40,0.95)');
    grd.addColorStop(0.6, 'rgba(200,90,60,0.7)');
    grd.addColorStop(1, 'rgba(180,100,70,0)');
    x.fillStyle = grd;
    x.beginPath();
    x.ellipse(1500, 620, 140, 90, 0, 0, Math.PI * 2);
    x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 16;
  return t;
}

function makeSunTexture2() {

  const img = x.createImageData(1024, 512);

    }
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 16;
  return t;
}

function createMilkyWay() {
  const count = 12000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 800 + Math.random() * 1500;
    const theta = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 200 * Math.exp(-r/2000);
    pos[i*3] = r * Math.cos(theta); pos[i*3+1] = y * 0.4; pos[i*3+2] = r * Math.sin(theta) * 0.7;
    const t = Math.random();
    let cr, cg, cb;
    if (t < 0.4) { cr=0.85; cg=0.8; cb=1.0; }
    else if (t < 0.7) { cr=1.0; cg=0.9; cb=0.75; }
    else { cr=0.9; cg=0.95; cb=1.0; }
    col[i*3]=cr; col[i*3+1]=cg; col[i*3+2]=cb;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 2.5, vertexColors: true, transparent: true, opacity: 0.55, sizeAttenuation: true, depthWrite: false
  })));
}

function createStars() {
  const count = 10000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 300 + Math.random() * 700;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos((Math.random() * 2) - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const t = Math.random();
    if (t < 0.5) { col[i*3]=1; col[i*3+1]=1; col[i*3+2]=1; }
    else if (t < 0.7) { col[i*3]=0.7; col[i*3+1]=0.85; col[i*3+2]=1; }
    else if (t < 0.9) { col[i*3]=1; col[i*3+1]=0.9; col[i*3+2]=0.7; }
    else { col[i*3]=1; col[i*3+1]=0.7; col[i*3+2]=0.6; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.7, vertexColors: true, transparent: true, opacity: 0.95
  })));
}

function createNebula() {
  [0xff44aa, 0x44aaff, 0xaa44ff, 0xff6644].forEach(color => {

    const bx = (Math.random() - 0.5) * 3000, by = (Math.random() - 0.5) * 1500, bz = (Math.random() - 0.5) * 3000;
    for (let i = 0; i < count; i++) {

    const pts = c.map(s => new THREE.Vector3(...s));
    group.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 })
    ));
    pts.forEach(p => {
      const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      star.position.copy(p);
      group.add(star);
    });
  });
  group.visible = false;
  scene.add(group);
  return group;
}

const clickables = [];
const orbitLines = [];
const labelDivs = [];
const trailLines = [];
const planetRefs = {};

function createPlanets() {
  [...PLANETS, ...DWARFS].forEach(data => {
    // مدار بیضی
    const e = ORBIT_ECC[data.name] || 0;
    const pts = [];
    for (let i = 0; i <= 256; i++) {
      const a = (i/256) * Math.PI * 2;
      // معادله بیضی: r = a(1-e²)/(1+e cos θ)
      const r = data.dist * (1 - e*e) / (1 + e * Math.cos(a));
      pts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
    }
    const orbit = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x4477aa, transparent: true, opacity: 0.35 })
    );
    scene.add(orbit);
    orbitLines.push(orbit);

    // بافت اختصاصی هر سیاره
    let map;
    const key = data.en.toLowerCase();
    if (key === 'earth') map = makeEarthTexture();
    else if (key === 'jupiter') map = makeGasGiantTexture(data.color, 22, true);
    else if (key === 'saturn') map = makeGasGiantTexture(data.color, 18, false);
    else if (key === 'uranus' || key === 'neptune') map = makeGasGiantTexture(data.color, 8, false);
    else if (key === 'venus') map = makeGasGiantTexture(data.color, 10, false);
    else if (key === 'mars') {
      // مریخ با قطب‌های یخی
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 512;
      const x = c.getContext('2d');
      x.drawImage(makeRockyTexture(data.color, 0.35, 'mars').image, 0, 0);
      // کلاهک قطبی شمالی
      x.fillStyle = 'rgba(240,240,250,0.9)';
      x.beginPath();
      x.ellipse(512, 30, 200, 50, 0, 0, Math.PI * 2);
      x.fill();
      // کلاهک جنوبی
      x.beginPath();
      x.ellipse(512, 482, 150, 40, 0, 0, Math.PI * 2);
      x.fill();
      map = new THREE.CanvasTexture(c);
      map.anisotropy = 16;
    }
    else map = makeRockyTexture(data.color, 0.25, key);

    const mat = new THREE.MeshStandardMaterial({
      map: map, roughness: 0.92, metalness: 0.02,
      emissive: data.color, emissiveIntensity: 0.04
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.size, 64, 64), mat);
    const baseAngle = Math.random() * Math.PI * 2;
    mesh.userData = {
      ...data, baseAngle: baseAngle, angle: baseAngle,
      isPlanet: true, isDwarf: DWARFS.includes(data),
      moonMeshes: [], eccentricity: e,
      info: {
        name: data.name, en: data.en, color: data.color,
        diameter: data.diameter, distance: data.distance,
        year: data.year, day: data.day, moons: data.moons,
        temp: data.temp, gravity: data.gravity, fact: data.fact
      }
    };
    mesh.rotation.z = data.tilt;
    scene.add(mesh);
    clickables.push(mesh);
    planetRefs[data.name] = mesh;

    // زمین: ابرها + چراغ شهر
    if (key === 'earth') {
      const cloudMesh = new THREE.Mesh(
        new THREE.SphereGeometry(data.size * 1.005, 64, 64),
        new THREE.MeshStandardMaterial({
          map: makeEarthClouds(), transparent: true, opacity: 0.9,
          depthWrite: false, roughness: 1
        })
      );
      mesh.add(cloudMesh);
      mesh.userData.cloudMesh = cloudMesh;

      const nightLights = new THREE.Mesh(
        new THREE.SphereGeometry(data.size * 1.002, 64, 64),
        new THREE.MeshBasicMaterial({
          map: makeEarthLights(), transparent: true, opacity: 0.9,
          blending: THREE.AdditiveBlending, depthWrite: false
        })
      );
      mesh.add(nightLights);
      mesh.userData.nightLights = nightLights;

      // جو زمین
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(data.size * 1.08, 64, 64),
        new THREE.MeshBasicMaterial({
          color: 0x5aafff, transparent: true, opacity: 0.18,
          blending: THREE.AdditiveBlending, side: THREE.BackSide
        })
      );
      mesh.add(atmo);

      // هاله‌ی جو (دو لایه)
      const atmo2 = new THREE.Mesh(
        new THREE.SphereGeometry(data.size * 1.15, 48, 48),
        new THREE.MeshBasicMaterial({
          color: 0x3a8fdf, transparent: true, opacity: 0.08,
          blending: THREE.AdditiveBlending, side: THREE.BackSide
        })
      );
      mesh.add(atmo2);
    }

    // زحل: حلقه‌ی دقیق‌تر با شکاف
    if (key === 'saturn') {
      const ringCanvas = document.createElement('canvas');
      ringCanvas.width = 1024; ringCanvas.height = 64;
      const rx = ringCanvas.getContext('2d');
      for (let i = 0; i < 1024; i++) {
        const f = i / 1024;
        let alpha = 0.75;
        // شکاف کاسینی
        if (f > 0.42 && f < 0.48) alpha = 0.1;
        // شکاف انکه
        if (f > 0.7 && f < 0.72) alpha = 0.3;
        // نویز
        const n = 0.6 + Math.sin(i * 0.15) * 0.15 + Math.random() * 0.15;
        const bright = 180 + Math.sin(i * 0.1) * 30;
        rx.fillStyle = `rgba(${bright}, ${bright-30}, ${bright-70}, ${alpha * n})`;
        rx.fillRect(i, 0, 1, 64);
      }
      const ringTex = new THREE.CanvasTexture(ringCanvas);
      ringTex.anisotropy = 16;
      const ringGeo = new THREE.RingGeometry(data.size * 1.35, data.size * 2.4, 256);
      // UV اصلاح‌شده برای رینگ
      const pos = ringGeo.attributes.position;
      const uv = ringGeo.attributes.uv;
      const v3 = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v3.fromBufferAttribute(pos, i);
        const r = v3.length();
        uv.setXY(i, (r - data.size * 1.35) / (data.size * 1.05), 0.5);
      }
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
        map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.92, depthWrite: false
      }));
      ring.rotation.x = Math.PI / 2 + 0.42;
      mesh.add(ring);
    }

    // جو برای غول‌های گازی
    if (['jupiter','saturn','uranus','neptune'].includes(key)) {
      const atmoColor = { jupiter: 0xffaa66, saturn: 0xffcc88, uranus: 0x88ddff, neptune: 0x5577dd }[key];
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(data.size * 1.06, 48, 48),
        new THREE.MeshBasicMaterial({
          color: atmoColor, transparent: true, opacity: 0.12,
          blending: THREE.AdditiveBlending, side: THREE.BackSide
        })
      );
      mesh.add(atmo);
    }

    // دنباله
    const trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(300 * 3), 3));
    const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
      color: data.glow, transparent: true, opacity: 0.5
    }));
    trail.visible = false;
    trail.userData.positions = [];
    scene.add(trail);
    trailLines.push(trail);
    mesh.userData.trail = trail;

    // برچسب
    const div = document.createElement('div');
    div.className = 'label' + (DWARFS.includes(data) ? ' dwarf' : '');
    div.textContent = data.name;
    const label = new THREE.CSS2DObject(div);
    label.position.set(0, data.size + 0.6, 0);
    mesh.add(label);
    labelDivs.push(div);
  });
}

function createMoons() {
  FAMOUS_MOONS.forEach(m => {
    const parentMesh = planetRefs[m.parent];
    if (!parentMesh) return;
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(m.size, 32, 32),
      new THREE.MeshStandardMaterial({ map: makeRockyTexture(m.color, 0.3, 'moon'), roughness: 0.95 })
    );
    moon.userData = { angle: Math.random()*Math.PI*2, speed: m.speed, dist: m.dist, name: m.name, isMoon: true };
    parentMesh.add(moon);
    parentMesh.userData.moonMeshes.push(moon);
    const div = document.createElement('div');
    div.className = 'label moon';
    div.textContent = m.name;
    const label = new THREE.CSS2DObject(div);
    label.position.set(0, m.size + 0.25, 0);
    moon.add(label);
    labelDivs.push(div);
  });
}

let supernovaStar, supernovaParticles, supernovaState = 'idle', supernovaTimer = 0;
function createSupernova() {
  const group = new THREE.Group();
  group.position.set(200, 60, -180);

  supernovaStar = new THREE.Mesh(
    new THREE.SphereGeometry(2, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  supernovaStar.add(new THREE.Mesh(
    new THREE.SphereGeometry(2.8, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending })
  ));
  group.add(supernovaStar);
  group.add(new THREE.PointLight(0xffffff, 2, 30));

  const pCount = 400;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  const pVel = [];
  for (let i = 0; i < pCount; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos((Math.random() * 2) - 1);
    const speed = 8 + Math.random() * 14;
    pVel.push({
      x: Math.sin(ph) * Math.cos(th) * speed,
      y: Math.cos(ph) * speed,
      z: Math.sin(ph) * Math.sin(th) * speed
    });
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  supernovaParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color: 0xffcc66, size: 1, transparent: true, opacity: 0, blending: THREE.AdditiveBlending
  }));
  supernovaParticles.userData.vel = pVel;
  group.add(supernovaParticles);

  const div = document.createElement('div');
  div.className = 'label special';
  div.textContent = 'ستاره متغیر';
  const label = new THREE.CSS2DObject(div);
  label.position.set(0, 3, 0);
  group.add(label);
  labelDivs.push(div);

  scene.add(group);
  supernovaStar.userData = {
    name: 'ستاره ابرنواختر', isSupernova: true,
    info: {
      name:'ستاره ابرنواختر', en:'Supernova Candidate', color:0xffffff,
      diameter:'—', distance:'خیلی دور', year:'—', day:'—', moons:'—',
      temp:'میلیون‌ها درجه', gravity:'—', fact:'ستاره‌ای که در آستانه انفجاره.'
    }
  };
  clickables.push(supernovaStar);
}

function updateSupernova(dt) {
  supernovaTimer += dt;
  if (supernovaState === 'idle' && supernovaTimer > 6) {
    supernovaState = 'explode';
    supernovaTimer = 0;
    supernovaStar.material.color.setHex(0xffffcc);
    supernovaParticles.material.opacity = 1;
    const arr = supernovaParticles.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i++) arr[i] = 0;
    supernovaParticles.geometry.attributes.position.needsUpdate = true;
  } else if (supernovaState === 'explode') {
    const arr = supernovaParticles.geometry.attributes.position.array;
    const vel = supernovaParticles.userData.vel;
    for (let i = 0; i < vel.length; i++) {
      arr[i*3] += vel[i].x * dt * 3;
      arr[i*3+1] += vel[i].y * dt * 3;
      arr[i*3+2] += vel[i].z * dt * 3;
    }
    supernovaParticles.geometry.attributes.position.needsUpdate = true;
    supernovaParticles.material.opacity = Math.max(0, 1 - supernovaTimer / 2.5);
    if (supernovaTimer > 2.5) { supernovaState = 'fade'; supernovaTimer = 0; }
  } else if (supernovaState === 'fade') {
    if (supernovaTimer > 2) {
      supernovaState = 'idle';
      supernovaTimer = 0;
      supernovaStar.material.color.setHex(0xffffff);
      supernovaParticles.material.opacity = 0;
    }
  }
}

const meteors = [];
function createMeteors() {
  for (let i = 0; i < 10; i++) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(24 * 3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
    }));
    scene.add(line);
    const m = { line, arr: geo.attributes.position.array, x:0, y:0, z:0, vx:0, vy:0, vz:0, life:0 };
    resetMeteor(m);
    meteors.push(m);
  }
}
function resetMeteor(m) {
  const startR = 200 + Math.random() * 100;
  const startTh = Math.random() * Math.PI * 2;
  m.x = Math.cos(startTh) * startR;
  m.y = 50 + Math.random() * 100;
  m.z = Math.sin(startTh) * startR;
  const speed = 80 + Math.random() * 60;
  m.vx = -m.x / startR * speed;
  m.vy = -20 - Math.random() * 30;
  m.vz = -m.z / startR * speed;
  m.life = 100 + Math.random() * 60;
}
function updateMeteors(dt) {
  meteors.forEach(m => {
    if (m.life <= 0) resetMeteor(m);
    m.life -= dt;
    m.x += m.vx * dt; m.y += m.vy * dt; m.z += m.vz * dt;
    const L = m.arr.length / 3;
    for (let i = 0; i < L; i++) {
      const f = i / L;
      m.arr[i*3] = m.x + m.vx * f * 0.4;
      m.arr[i*3+1] = m.y + m.vy * f * 0.4;
      m.arr[i*3+2] = m.z + m.vz * f * 0.4;
    }
    m.line.geometry.attributes.position.needsUpdate = true;
    m.line.material.opacity = Math.min(1, m.life / 60);
  });
}

let isDown = false, prevX = 0, prevY = 0;
let theta = 0.5, phi = Math.PI / 3, camRadius = 60;
const INITIAL = { theta: 0.5, phi: Math.PI/3, radius: 60 };
let followMesh = null;
let camTargetX = 0, camTargetY = 0, camTargetZ = 0;

function updateCamera() {
  if (followMesh) {
    const p = new THREE.Vector3();
    followMesh.getWorldPosition(p);
    camTargetX = p.x; camTargetY = p.y; camTargetZ = p.z;
  } else {
    camTargetX += (0 - camTargetX) * 0.08;
    camTargetY += (0 - camTargetY) * 0.08;
    camTargetZ += (0 - camTargetZ) * 0.08;
  }
  camera.position.x = camTargetX + camRadius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = camTargetY + camRadius * Math.cos(phi);
  camera.position.z = camTargetZ + camRadius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(camTargetX, camTargetY, camTargetZ);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDown = true; prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('mouseup', () => isDown = false);
window.addEventListener('mousemove', e => {
  if (!isDown || fpMode.on) return;
  theta -= (e.clientX - prevX) * 0.005;
  phi -= (e.clientY - prevY) * 0.005;
  phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camRadius += e.deltaY * 0.05;
  camRadius = Math.max(3, Math.min(400, camRadius));
}, { passive: false });

let mouseDownPos = null;
renderer.domElement.addEventListener('mousedown', e => {
  mouseDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('click', e => {
  if (!mouseDownPos || fpMode.on) return;
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > 5) return;

  mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects([sun, ...clickables], false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj.userData.info) {
      showPlanetInfo(obj.userData.info, obj);
      zoomToObject(obj);
      unlockAchievement('explorer', obj.userData.info.name);
    }
  }
});

function zoomToObject(obj) {
  followMesh = obj;
  const p = new THREE.Vector3();
  obj.getWorldPosition(p);
  camTargetX = p.x; camTargetY = p.y; camTargetZ = p.z;
  const targetRadius = obj.userData.size ? obj.userData.size * 7 + 3 : 10;
  const startRadius = camRadius;
  const startTime = performance.now();
  function step() {
    const t = Math.min(1, (performance.now() - startTime) / 900);
    const ease = 1 - Math.pow(1 - t, 3);
    camRadius = startRadius + (targetRadius - startRadius) * ease;
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

const fpMode = { on: false, yaw: 0, pitch: 0, keys: {}, pos: new THREE.Vector3(0, 0, 60) };

document.getElementById('btnFPS').onclick = function() {
  fpMode.on = !fpMode.on;
  this.classList.toggle('active', fpMode.on);
  document.getElementById('hud').classList.toggle('on', fpMode.on);
  if (fpMode.on) {
    followMesh = null;
    fpMode.pos.set(camera.position.x, camera.position.y, camera.position.z);
    fpMode.yaw = theta;
    fpMode.pitch = Math.PI / 2 - phi;
  }
};

window.addEventListener('keydown', e => { fpMode.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { fpMode.keys[e.key.toLowerCase()] = false; });

document.addEventListener('mousemove', e => {
  if (!fpMode.on || !isDown) return;
  fpMode.yaw -= e.movementX * 0.003;
  fpMode.pitch -= e.movementY * 0.003;
  fpMode.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, fpMode.pitch));
});

function updateFPS(dt) {
  if (!fpMode.on) return;
  const speed = (fpMode.keys['shift'] ? 30 : 12) * dt;
  const dir = new THREE.Vector3(
    Math.sin(fpMode.yaw) * Math.cos(fpMode.pitch),
    Math.sin(fpMode.pitch),
    Math.cos(fpMode.yaw) * Math.cos(fpMode.pitch)
  );
  const right = new THREE.Vector3(Math.cos(fpMode.yaw), 0, -Math.sin(fpMode.yaw));

  if (fpMode.keys['w']) fpMode.pos.addScaledVector(dir, speed);
  if (fpMode.keys['s']) fpMode.pos.addScaledVector(dir, -speed);
  if (fpMode.keys['a']) fpMode.pos.addScaledVector(right, -speed);
  if (fpMode.keys['d']) fpMode.pos.addScaledVector(right, speed);
  if (fpMode.keys[' ']) fpMode.pos.y += speed;
  if (fpMode.keys['control']) fpMode.pos.y -= speed;

  camera.position.copy(fpMode.pos);
  const look = fpMode.pos.clone().addScaledVector(dir, 10);
  camera.lookAt(look);
}

const unlocked = new Set();

function unlockAchievement(id, targetName) {
  if (targetName) visitedNames.add(targetName);
  if (id === 'explorer' && targetName === 'خورشید') unlock('sunLover');
  if (id === 'explorer' && (targetName === 'سرس' || targetName === 'پلوتو')) unlock('dwarfFinder');
  if (id === 'explorer' && (targetName === 'وویجر ۱' || targetName === 'وویجر ۲')) unlock('voyager');
  if (id === 'explorer' && targetName === 'سیاه‌چاله') unlock('blackHole');
  if (id === 'explorer' && targetName === 'Trappist-1') unlock('trappist');
  if (id === 'explorer' && targetName === 'ستاره ابرنواختر') unlock('supernova');
  unlock('firstVisit');
  const planetNames = [...PLANETS, ...DWARFS].map(p => p.name);
  if (planetNames.every(n => visitedNames.has(n))) unlock('explorer');
  updateAchUI();
}

  const t = document.createElement('div');
  t.className = 'ach-toast';
  t.textContent = '🏆 ' + a.title + ' — ' + a.desc;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

};
function nextTourStop() {
  if (!tourOn) return;
  if (tourIndex >= tourBodies.length) tourIndex = 0;
  const obj = tourBodies[tourIndex];
  if (obj && obj.userData.info) {
    showPlanetInfo(obj.userData.info, obj);
    zoomToObject(obj);
    document.getElementById('tourText').textContent = '🎥 در حال نمایش: ' + obj.userData.info.name;

function buildSizeCompare() {
  const content = document.getElementById('scContent');
  content.innerHTML = '';
  const all = [
    { name: 'خورشید', r: 696000, color: '#ffcc00' },
    ...PLANETS.map(p => ({ name: p.name, r: p.realR, color: '#' + p.color.toString(16).padStart(6,'0') })),
    { name: 'سرس', r: 470, color: '#998877' },
    { name: 'پلوتو', r: 1188, color: '#c8b8a0' }
  ];
  const row1 = document.createElement('div'); row1.className = 'row';
  all.filter(b => ['خورشید','مشتری','زحل'].includes(b.name)).forEach(b => row1.appendChild(buildBody(b, 0.00008)));
  content.appendChild(row1);
  const row2 = document.createElement('div'); row2.className = 'row';
  all.filter(b => ['اورانوس','نپتون','زمین','زهره','مریخ','عطارد'].includes(b.name)).forEach(b => row2.appendChild(buildBody(b, 0.00025)));
  content.appendChild(row2);
  const row3 = document.createElement('div'); row3.className = 'row';
  all.filter(b => ['پلوتو','سرس'].includes(b.name)).forEach(b => row3.appendChild(buildBody(b, 0.0012)));
  content.appendChild(row3);
}
function buildBody(b, scale) {
  const size = Math.max(20, b.r * scale);
  const wrap = document.createElement('div');
  wrap.className = 'body';
  const circle = document.createElement('div');
  circle.className = 'circle';
  circle.style.width = size + 'px';
  circle.style.height = size + 'px';
  circle.style.background = b.color;
  circle.style.color = b.color;
  wrap.appendChild(circle);
  const name = document.createElement('div'); name.className = 'name'; name.textContent = b.name;
  wrap.appendChild(name);
  const dim = document.createElement('div'); dim.className = 'dim';
  dim.textContent = b.r.toLocaleString('fa-IR') + ' km';
  wrap.appendChild(dim);
  return wrap;
}

const QUIZ_QUESTIONS = [
  { q: 'کدام سیاره بزرگ‌ترین کوه منظومه شمسی رو داره؟', opts: ['زمین','مریخ','مشتری','زهره'], ans: 1 },
  { q: 'داغ‌ترین سیاره کدام است؟', opts: ['عطارد','زهره','مریخ','مشتری'], ans: 1 },
  { q: 'کدام سیاره روی پهلو می‌چرخه؟', opts: ['نپتون','اورانوس','زحل','زمین'], ans: 1 },
  { q: 'بزرگ‌ترین سیاره منظومه شمسی؟', opts: ['زحل','مشتری','اورانوس','نپتون'], ans: 1 },
  { q: 'حلقه‌ی زحل از چه ساخته شده؟', opts: ['گاز','یخ و سنگ','آتش','فلز'], ans: 1 },
  { q: 'چند سیاره در منظومه شمسی داریم؟', opts: ['۷','۸','۹','۱۰'], ans: 1 },
  { q: 'کدام سیاره سریع‌ترین بادها رو داره؟', opts: ['مشتری','نپتون','زحل','زمین'], ans: 1 },
  { q: 'سیاره‌ای که به «سیاره سرخ» معروفه؟', opts: ['مریخ','مشتری','زهره','عطارد'], ans: 0 },
  { q: 'در کدام سیاره باران اسیدی می‌باره؟', opts: ['زهره','مریخ','زمین','اورانوس'], ans: 0 },
  { q: 'کدام مأموریت اولین انسان را به ماه برد؟', opts: ['وویجر','آپولو ۱۱','کاسینی','جیمز وب'], ans: 1 }
];
let quizIndex = 0, quizScore = 0;

document.getElementById('btnQuiz').onclick = () => {
  quizIndex = 0; quizScore = 0;
  document.getElementById('quiz').classList.add('open');
  renderQuiz();
};
document.getElementById('quizClose').onclick = () => {
  document.getElementById('quiz').classList.remove('open');
};
function renderQuiz() {
  const box = document.getElementById('quizBox');
  if (quizIndex >= QUIZ_QUESTIONS.length) {
    box.innerHTML = `<h2>🎉 نتیجه‌ی آزمون</h2>
      <div class="quiz-result">امتیاز شما: <b>${quizScore}</b> از ${QUIZ_QUESTIONS.length}<br><br>
      ${quizScore >= 8 ? '🏆 فوق‌العاده! فضانورد واقعی!' : quizScore >= 5 ? '👏 خوب بود!' : '📚 یه کم مطالعه کن!'}
      </div>
      <button class="sm" style="margin-top:20px;width:100%;padding:12px" id="quizAgain">🔄 دوباره</button>`;
    const again = document.getElementById('quizAgain');
    if (again) again.onclick = () => { quizIndex = 0; quizScore = 0; renderQuiz(); };
    if (quizScore >= 8) unlock('quizMaster');
    return;
  }
  const q = QUIZ_QUESTIONS[quizIndex];
  box.innerHTML = `<h2>🎓 آزمون فضایی</h2>
    <div class="quiz-q">${q.q}</div>
    ${q.opts.map((o,i) => `<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
    <div class="quiz-progress">سوال ${quizIndex+1} از ${QUIZ_QUESTIONS.length} | امتیاز: ${quizScore}</div>`;
  box.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      const chosen = parseInt(btn.dataset.i);
      const correct = q.ans;
      box.querySelectorAll('.quiz-opt').forEach((b, i) => {
        if (i === correct) b.classList.add('correct');
        else if (i === chosen && i !== correct) b.classList.add('wrong');
        b.style.pointerEvents = 'none';
      });
      if (chosen === correct) quizScore++;
      setTimeout(() => { quizIndex++; renderQuiz(); }, 1200);
    };
  });
}

const REF_YEAR = 2026;
document.getElementById('btnTravel').onclick = function() {
  document.getElementById('timeTravel').classList.toggle('open');
  this.classList.toggle('active');
};
document.querySelectorAll('#timeTravel .presets .sm').forEach(b => {
  b.onclick = () => {
    document.getElementById('yearInput').value = b.dataset.year;
    applyTimeTravel(parseInt(b.dataset.year));
  };
});
document.getElementById('yearInput').addEventListener('change', e => {
  applyTimeTravel(parseInt(e.target.value));
});
function applyTimeTravel(year) {
  if (isNaN(year)) return;
  unlock('timeTraveler');
  const daysDiff = (year - REF_YEAR) * 365.25;
  const periods = { 'عطارد':88, 'زهره':225, 'زمین':365.25, 'مریخ':687, 'مشتری':4333, 'زحل':10759, 'اورانوس':30687, 'نپتون':60190, 'سرس':1680, 'پلوتو':90560 };
  clickables.forEach(mesh => {
    if (!mesh.userData.isPlanet) return;
    const period = periods[mesh.userData.name] || 365;
    const baseAngle = mesh.userData.baseAngle || 0;
    mesh.userData.angle = baseAngle + (daysDiff / period) * Math.PI * 2;
  });
}

//   انیمیشن
// ============================================================
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (sun) sun.rotation.y += 0.0015 * timeScale;
  if (sunGlow) {
    sunGlow.rotation.y -= 0.001 * timeScale;
    if (sunGlow.userData.glow2) sunGlow.userData.glow2.rotation.y += 0.0008 * timeScale;
  }
  if (corona) corona.rotation.y += 0.0004 * timeScale;

  // سیارات با مکانیک کپلری
  clickables.forEach(mesh => {
    if (!mesh.userData.isPlanet) return;
    const d = mesh.userData;
    d.angle += d.speed * 0.5 * timeScale;
    // سرعت متغیر: نزدیک خورشید سریع‌تر (قانون دوم کپلر)
    const ecc = d.eccentricity || 0;
    const r = d.dist * (1 - ecc*ecc) / (1 + ecc * Math.cos(d.angle));
    mesh.position.x = Math.cos(d.angle) * r;
    mesh.position.z = Math.sin(d.angle) * r;
    // چرخش محوری
    mesh.rotation.y += 0.02 * timeScale;

    if (d.cloudMesh) d.cloudMesh.rotation.y += 0.005 * timeScale;

    // چراغ‌های شب زمین هم‌جهت با زمین می‌چرخن
    if (d.nightLights) d.nightLights.rotation.y = 0;

    // شفق
    if (d.aurora) {
      d.aurora[0].rotation.z += 0.005 * timeScale;
      d.aurora[1].rotation.z -= 0.005 * timeScale;
    }

    if (d.moonMeshes) {
      d.moonMeshes.forEach(moon => {
        const md = moon.userData;
        md.angle += md.speed * timeScale;
        moon.position.x = Math.cos(md.angle) * md.dist;
        moon.position.z = Math.sin(md.angle) * md.dist;
        moon.rotation.y += 0.03 * timeScale;
      });
    }
    if (mesh.userData.trail) {
      const t = mesh.userData.trail;
      const wp = new THREE.Vector3();
      mesh.getWorldPosition(wp);
      t.userData.positions.push(wp.clone());
      if (t.userData.positions.length > 100) t.userData.positions.shift();
      const arr = t.geometry.attributes.position.array;
      const pos = t.userData.positions;
      for (let i = 0; i < 100; i++) {
        const p = pos[Math.min(i, pos.length - 1)] || wp;
        arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
      }
      t.geometry.attributes.position.needsUpdate = true;
      t.geometry.setDrawRange(0, pos.length);
    }
  });

  probes.forEach(p => {
    const d = p.userData;
    if (d.outward) {
      d.angle += d.speed * timeScale;
      d.radius += d.outward * timeScale * 0.05;
      p.position.x = Math.cos(d.angle) * d.radius;
      p.position.z = Math.sin(d.angle) * d.radius;
      p.position.y = Math.sin(d.angle * 1.7) * 4;
      p.rotation.y = -d.angle;
      if (d.radius > 200) d.radius = 45;
    } else if (d.isJWST) {
      d.angle += d.speed * timeScale;
      p.position.x = 80 + Math.cos(d.angle) * d.radius;
      p.position.z = -50 + Math.sin(d.angle) * d.radius;
    } else if (d.isCassini) {
      d.angle += d.speed * timeScale;
      p.position.x = Math.cos(d.angle) * d.dist;
      p.position.z = Math.sin(d.angle) * d.dist;
    } else if (d.isApollo) {
      d.angle += d.speed * timeScale;
      p.position.x = Math.cos(d.angle) * d.radius;
      p.position.z = Math.sin(d.angle) * d.radius;
    }
  });

  if (iss) {
    const d = iss.userData;
    d.angle += d.speed * 0.02 * timeScale;
    iss.position.x = Math.cos(d.angle) * d.dist;
    iss.position.z = Math.sin(d.angle) * d.dist;
    iss.rotation.y = -d.angle;
  }

  if (accretionDisk) accretionDisk.rotation.z += 0.01 * timeScale;

  binaryStars.forEach(g => {
    const d = g.userData;
    d.angle += d.speed * timeScale;
    d.s1.position.x = Math.cos(d.angle) * d.radius;
    d.s1.position.z = Math.sin(d.angle) * d.radius;
    d.s2.position.x = -Math.cos(d.angle) * d.radius;
    d.s2.position.z = -Math.sin(d.angle) * d.radius;
    d.light1.position.copy(d.s1.position);
    d.light2.position.copy(d.s2.position);
  });

  if (trappist) {
    trappist.planets.forEach(p => {
      p.userData.angle += p.userData.speed * timeScale;
      p.position.x = Math.cos(p.userData.angle) * p.userData.dist;
      p.position.z = Math.sin(p.userData.angle) * p.userData.dist;
    });
  }

  updateSupernova(dt * timeScale);
  updateMeteors(dt * timeScale);

  if (comet) {
    const d = comet.userData;
    d.angle += d.speed * timeScale;
    const x = Math.cos(d.angle) * d.a;
    const z = Math.sin(d.angle) * d.b;
    const y = Math.sin(d.angle * 2) * 5;
    comet.position.set(x, y, z);
    d.tailHistory.push(new THREE.Vector3(x, y, z));
    if (d.tailHistory.length > d.tailLength) d.tailHistory.shift();
    const arr = cometTail.geometry.attributes.position.array;
    for (let i = 0; i < d.tailLength; i++) {
      const p = d.tailHistory[Math.min(i, d.tailHistory.length - 1)];
      arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
    }
    cometTail.geometry.attributes.position.needsUpdate = true;
    cometTail.geometry.setDrawRange(0, d.tailHistory.length);
  }

  if (fpMode.on) {
    updateFPS(dt);
  } else {
    updateCamera();
  }

  // رندر
  if (composer && bloomPass) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  labelRenderer.render(scene, camera);
}
