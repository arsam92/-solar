<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منظومه شمسی جامع</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #000; font-family: Tahoma, sans-serif; }
  canvas { display: block; }
  .glass {
    background: rgba(0,0,0,0.78);
    border: 1px solid rgba(79,195,247,0.3);
    backdrop-filter: blur(12px);
    border-radius: 12px; color: #fff;
  }
  #topBar {
    position: fixed; top: 12px; right: 12px;
    display: flex; gap: 8px; flex-wrap: wrap;
    z-index: 100; max-width: 70vw;
  }
  #info { padding: 10px 16px; font-size: 13px; line-height: 1.7; }
  #info b { color: #4fc3f7; }
  #info small { color: #aaa; font-size: 11px; }
  #dateBox {
    padding: 10px 16px; font-size: 12px;
    color: #4fc3f7; text-align: center; line-height: 1.6;
  }
  #dateBox b { color: #fff; display: block; font-size: 14px; }
  #searchBox {
    position: fixed; top: 12px; left: 12px;
    padding: 8px 12px; z-index: 100;
    display: flex; gap: 8px; align-items: center;
  }
  #searchBox input {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(79,195,247,0.4);
    color: #fff; padding: 6px 10px;
    border-radius: 8px; font-family: Tahoma;
    font-size: 13px; width: 140px; outline: none;
  }
  #searchBox input:focus { border-color: #4fc3f7; }
  button.sm {
    background: rgba(79,195,247,0.15);
    color: #4fc3f7; border: 1px solid #4fc3f7;
    padding: 6px 11px; border-radius: 8px;
    cursor: pointer; font-family: Tahoma;
    font-size: 11px; white-space: nowrap;
    transition: all 0.15s;
  }
  button.sm:hover { background: #4fc3f7; color: #000; }
  button.sm.active { background: #4fc3f7; color: #000; }
  #timeBar {
    position: fixed; bottom: 12px; left: 12px;
    padding: 10px 14px; min-width: 240px;
    z-index: 100; font-size: 12px;
  }
  #timeBar label { color: #4fc3f7; font-weight: bold; }
  #speedSlider {
    width: 100%; margin-top: 6px;
    -webkit-appearance: none; height: 5px;
    border-radius: 3px; background: rgba(79,195,247,0.3);
    outline: none;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #4fc3f7;
    cursor: pointer; box-shadow: 0 0 10px #4fc3f7;
  }
  #speedValue { color: #4fc3f7; font-weight: bold; }
  #controls {
    position: fixed; bottom: 12px; right: 12px;
    padding: 8px 12px; z-index: 100;
    display: flex; gap: 6px; flex-wrap: wrap;
    max-width: 68vw;
  }
  .label {
    color: #fff; font-family: Tahoma, sans-serif;
    font-size: 12px; font-weight: bold;
    text-shadow: 0 0 10px rgba(79,195,247,0.9), 0 0 20px rgba(79,195,247,0.5);
    background: rgba(0,0,0,0.4);
    padding: 2px 8px; border-radius: 5px;
    pointer-events: none; white-space: nowrap;
  }
  .label.dwarf { color: #bbaaff; font-size: 11px; }
  .label.moon { color: #88ddff; font-size: 10px; }
  .label.probe { color: #ffcc44; font-size: 10px; }
  .label.special { color: #ff88ff; font-size: 11px; }
  #planetInfo {
    position: fixed; top: 50%; left: 20px;
    transform: translateY(-50%) translateX(-120%);
    width: 320px; max-height: 80vh; overflow-y: auto;
    background: rgba(10,15,30,0.95);
    border: 1px solid rgba(79,195,247,0.5);
    border-radius: 16px; padding: 22px;
    z-index: 200; backdrop-filter: blur(15px);
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 20px 60px rgba(79,195,247,0.2);
  }
  #planetInfo.open { transform: translateY(-50%) translateX(0); }
  #planetInfo .p-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(79,195,247,0.2);
  }
  #planetInfo .p-color {
    width: 44px; height: 44px; border-radius: 50%;
    box-shadow: 0 0 20px currentColor; flex-shrink: 0;
  }
  #planetInfo .p-name { color: #fff; font-size: 22px; font-weight: bold; }
  #planetInfo .p-name small {
    display: block; color: #4fc3f7;
    font-size: 12px; font-weight: normal; margin-top: 3px;
  }
  #planetInfo .p-row {
    display: flex; justify-content: space-between;
    padding: 7px 0; color: #ccc; font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 10px;
  }
  #planetInfo .p-row:last-child { border-bottom: none; }
  #planetInfo .p-row .k { color: #888; flex-shrink: 0; }
  #planetInfo .p-row .v { color: #4fc3f7; font-weight: bold; text-align: left; }
  #planetInfo .p-fact {
    margin-top: 12px; padding: 10px 14px;
    background: rgba(79,195,247,0.08);
    border-left: 3px solid #4fc3f7;
    border-radius: 8px; font-size: 12px;
    color: #aaccee; line-height: 1.8;
  }
  #planetInfo .p-buttons { display: flex; gap: 8px; margin-top: 14px; }
  #planetInfo .p-buttons button {
    flex: 1; padding: 8px 12px;
    background: rgba(79,195,247,0.15);
    color: #4fc3f7; border: 1px solid #4fc3f7;
    border-radius: 8px; cursor: pointer;
    font-family: Tahoma; font-size: 12px;
  }
  #planetInfo .p-buttons button:hover { background: #4fc3f7; color: #000; }
  #planetInfo .p-buttons button.active { background: #4fc3f7; color: #000; }
  #planetInfo .p-close {
    position: absolute; top: 12px; left: 12px;
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,80,80,0.2);
    color: #ff5050; border: 1px solid #ff5050;
    cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  #planetInfo .p-close:hover { background: #ff5050; color: #000; }
  #hint {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: #888; font-size: 11px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid rgba(79,195,247,0.15);
    z-index: 99; pointer-events: none;
  }
  #hint b { color: #4fc3f7; }
  #achievements {
    position: fixed; top: 12px; right: 12px;
    width: 220px; padding: 12px 16px;
    z-index: 150; font-size: 12px; display: none;
  }
  #achievements.open { display: block; }
  #achievements h3 {
    color: #ffcc44; font-size: 14px;
    margin: 0 0 10px;
    display: flex; justify-content: space-between;
  }
  #achievements .ach {
    padding: 6px 10px; margin: 4px 0;
    background: rgba(255,204,68,0.1);
    border-left: 3px solid #ffcc44;
    border-radius: 6px;
    color: #ffdd88; font-size: 11px;
  }
  #achievements .ach.locked { opacity: 0.3; border-left-color: #666; color: #888; }
  .ach-toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ffcc44, #ff9900);
    color: #000; padding: 14px 28px;
    border-radius: 12px; font-weight: bold; font-size: 15px;
    box-shadow: 0 10px 40px rgba(255,204,68,0.5);
    z-index: 300;
    animation: achIn 0.5s ease, achOut 0.5s ease 3s forwards;
    pointer-events: none;
  }
  @keyframes achIn { from { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.8); } }
  @keyframes achOut { to { opacity: 0; transform: translateX(-50%) translateY(-30px); } }
  #sizeCompare {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 250; display: none;
    padding: 40px; overflow-y: auto;
  }
  #sizeCompare.open { display: block; }
  #sizeCompare h2 { color: #4fc3f7; text-align: center; font-size: 22px; margin-bottom: 30px; }
  #sizeCompare .row {
    display: flex; align-items: flex-end;
    justify-content: center; gap: 40px;
    flex-wrap: wrap; margin-bottom: 30px;
    padding: 20px; border-bottom: 1px solid rgba(79,195,247,0.2);
  }
  #sizeCompare .body { text-align: center; color: #fff; }
  #sizeCompare .circle {
    border-radius: 50%; margin: 0 auto 10px;
    box-shadow: 0 0 30px currentColor;
  }
  #sizeCompare .name { font-size: 13px; font-weight: bold; }
  #sizeCompare .dim { font-size: 10px; color: #888; margin-top: 3px; }
  .modal-close {
    position: fixed; top: 20px; right: 20px;
    width: 40px; height: 40px;
    background: rgba(255,80,80,0.2);
    color: #ff5050; border: 1px solid #ff5050;
    border-radius: 10px; cursor: pointer; font-size: 20px;
    z-index: 260;
  }
  #quiz {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 250; display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #quiz.open { display: flex; }
  .quiz-box {
    width: min(520px, 100%);
    background: rgba(10,15,30,0.98);
    border: 1px solid rgba(79,195,247,0.5);
    border-radius: 20px; padding: 30px;
    box-shadow: 0 20px 80px rgba(79,195,247,0.3);
  }
  .quiz-box h2 { color: #4fc3f7; margin: 0 0 20px; font-size: 20px; }
  .quiz-q { color: #fff; font-size: 16px; margin-bottom: 18px; line-height: 1.7; }
  .quiz-opt {
    display: block; width: 100%;
    padding: 12px 18px; margin-bottom: 10px;
    background: rgba(79,195,247,0.1);
    color: #fff; border: 1px solid rgba(79,195,247,0.3);
    border-radius: 10px; cursor: pointer;
    font-family: Tahoma; font-size: 14px;
    text-align: right; transition: all 0.15s;
  }
  .quiz-opt:hover { background: rgba(79,195,247,0.25); }
  .quiz-opt.correct { background: rgba(80,255,120,0.3); border-color: #50ff78; }
  .quiz-opt.wrong { background: rgba(255,80,80,0.3); border-color: #ff5050; }
  .quiz-progress { color: #888; font-size: 12px; margin-top: 12px; }
  .quiz-result { color: #ffcc44; font-size: 18px; text-align: center; line-height: 1.8; }
  #timeTravel {
    position: fixed; top: 60px; left: 12px;
    padding: 12px 16px; z-index: 150;
    display: none; min-width: 240px;
  }
  #timeTravel.open { display: block; }
  #timeTravel label { color: #4fc3f7; font-weight: bold; font-size: 12px; }
  #timeTravel input {
    width: 100%; margin-top: 8px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(79,195,247,0.4);
    color: #fff; border-radius: 8px;
    font-family: Tahoma; font-size: 12px;
  }
  #timeTravel .presets {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .tour-banner {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%);
    background: rgba(79,195,247,0.9);
    color: #000; padding: 10px 24px;
    border-radius: 10px; font-weight: bold;
    z-index: 150; font-size: 14px;
    display: none;
    box-shadow: 0 8px 30px rgba(79,195,247,0.4);
  }
  .tour-banner.open { display: block; }
  .tour-banner button {
    margin-right: 12px; padding: 4px 10px;
    background: rgba(0,0,0,0.3); color: #fff;
    border: none; border-radius: 6px;
    cursor: pointer; font-size: 12px;
    font-family: Tahoma;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.4); border-radius: 3px; }
</style>
</head>
<body>

<div id="topBar">
  <div id="info" class="glass">
    🌌 <b>منظومه شمسی</b><br>
    <small>🖱️ بکش: چرخش | 🎡 اسکرول: زوم | 👆 کلیک: اطلاعات</small>
  </div>
  <div id="dateBox" class="glass">
    <b id="dateVal"></b>
    <span id="timeVal"></span>
  </div>
</div>

<div id="searchBox" class="glass">
  <input id="searchInput" placeholder="جستجو...">
  <button class="sm" id="searchBtn">🔍</button>
</div>

<div id="timeTravel" class="glass">
  <label>⏰ سفر در زمان</label>
  <input id="yearInput" type="number" value="2026" min="1900" max="2200">
  <div class="presets">
    <button class="sm" data-year="1969">۱۹۶۹ آپولو</button>
    <button class="sm" data-year="1977">۱۹۷۷ وویجر</button>
    <button class="sm" data-year="2026">اکنون</button>
    <button class="sm" data-year="2061">۲۰۶۱ هالی</button>
  </div>
</div>

<div id="achievements" class="glass">
  <h3>🏆 دستاوردها <span id="achCount">0/10</span></h3>
  <div id="achList"></div>
</div>

<div class="tour-banner" id="tourBanner">
  <span id="tourText"></span>
  <button id="tourStop">توقف</button>
</div>

<div id="timeBar" class="glass">
  <label>⏱️ سرعت: <span id="speedValue">1.0x</span></label>
  <input type="range" id="speedSlider" min="0" max="50" value="10">
</div>

<div id="controls">
  <button class="sm" id="btnLabels">📝 نام‌ها</button>
  <button class="sm" id="btnOrbits">⭕ مدارها</button>
  <button class="sm" id="btnConstellations">✨ فلکی</button>
  <button class="sm" id="btnTrails">💫 دنباله</button>
  <button class="sm" id="btnSound">🔊 صدا</button>
  <button class="sm" id="btnTour">🎥 تور</button>
  <button class="sm" id="btnTravel">⏰ زمان</button>
  <button class="sm" id="btnCompare">📏 اندازه</button>
  <button class="sm" id="btnQuiz">🎓 آزمون</button>
  <button class="sm" id="btnShot">📸 عکس</button>
  <button class="sm" id="btnSunView">☀️ خورشید</button>
  <button class="sm" id="btnAch">🏆</button>
  <button class="sm" id="btnReset">🔄</button>
</div>

<div id="hint">💡 روی هر جرم <b>کلیک کن</b> — دوربین پرواز می‌کنه سمتش</div>

<div id="planetInfo">
  <button class="p-close" id="piClose">✕</button>
  <div class="p-header">
    <div class="p-color" id="piColor"></div>
    <div class="p-name">
      <span id="piName"></span>
      <small id="piEnglish"></small>
    </div>
  </div>
  <div class="p-row"><span class="k">قطر</span><span class="v" id="piDiameter"></span></div>
  <div class="p-row"><span class="k">فاصله از خورشید</span><span class="v" id="piDistance"></span></div>
  <div class="p-row"><span class="k">مدت یک سال</span><span class="v" id="piYear"></span></div>
  <div class="p-row"><span class="k">مدت یک روز</span><span class="v" id="piDay"></span></div>
  <div class="p-row"><span class="k">تعداد قمرها</span><span class="v" id="piMoons"></span></div>
  <div class="p-row"><span class="k">دما</span><span class="v" id="piTemp"></span></div>
  <div class="p-fact" id="piFact"></div>
  <div class="p-buttons">
    <button id="piFollow">🎯 دنبال کن</button>
    <button id="piZoom">🔍 نزدیک شو</button>
  </div>
</div>

<div id="sizeCompare">
  <button class="modal-close" id="scClose">✕</button>
  <h2>📏 مقایسه اندازه اجرام</h2>
  <div id="scContent"></div>
</div>

<div id="quiz">
  <button class="modal-close" id="quizClose">✕</button>
  <div class="quiz-box" id="quizBox"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

function makeTexture(baseColor, glowColor, type) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#' + baseColor.toString(16).padStart(6, '0');
  x.fillRect(0, 0, 512, 512);
  if (type === 'earth') {
    x.fillStyle = '#1a4a1a';
    [[80,150,60,40],[200,120,80,50],[320,180,70,45],[150,280,90,60],
     [350,300,60,40],[420,200,50,30],[90,350,70,50],[250,400,80,40]]
    .forEach(([px,py,w,h]) => { x.beginPath(); x.ellipse(px,py,w,h,Math.random()*Math.PI,0,Math.PI*2); x.fill(); });
    x.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 25; i++) {
      x.beginPath();
      x.ellipse(Math.random()*512, Math.random()*512, 20+Math.random()*40, 10+Math.random()*15, Math.random()*Math.PI, 0, Math.PI*2);
      x.fill();
    }
  } else if (type === 'jupiter' || type === 'saturn') {
    const stripes = type === 'jupiter' ? 16 : 12;
    for (let i = 0; i < stripes; i++) {
      const y = (i/stripes)*512, h = 512/stripes;
      x.fillStyle = `rgba(255,220,180,${Math.abs(Math.sin(i*1.3)*0.15 + 0.05)})`;
      x.fillRect(0, y, 512, h);
    }
    if (type === 'jupiter') {
      x.fillStyle = 'rgba(200,80,60,0.85)';
      x.beginPath(); x.ellipse(350, 300, 45, 28, 0, 0, Math.PI*2); x.fill();
    }
  } else if (type === 'mars') {
    x.fillStyle = 'rgba(120,50,30,0.6)';
    for (let i = 0; i < 35; i++) {
      x.beginPath();
      x.ellipse(Math.random()*512, Math.random()*512, 10+Math.random()*40, 8+Math.random()*20, Math.random()*Math.PI, 0, Math.PI*2);
      x.fill();
    }
    x.fillStyle = 'rgba(255,255,255,0.7)';
    x.fillRect(0, 0, 512, 30); x.fillRect(0, 482, 512, 30);
  } else if (type === 'venus') {
    x.fillStyle = 'rgba(255,240,200,0.4)';
    for (let i = 0; i < 45; i++) {
      x.beginPath();
      x.ellipse(Math.random()*512, Math.random()*512, 20+Math.random()*50, 10+Math.random()*20, Math.random()*Math.PI, 0, Math.PI*2);
      x.fill();
    }
  } else {
    for (let i = 0; i < 30; i++) {
      x.fillStyle = `rgba(0,0,0,${0.05 + Math.random()*0.15})`;
      x.beginPath();
      x.ellipse(Math.random()*512, Math.random()*512, 10+Math.random()*40, 8+Math.random()*25, Math.random()*Math.PI, 0, Math.PI*2);
      x.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  return t;
}

function makeSunTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 256, 0, 256, 256, 256);
  g.addColorStop(0, '#fff5a0'); g.addColorStop(0.5, '#ffcc33'); g.addColorStop(1, '#ff8800');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 70; i++) {
    x.fillStyle = `rgba(255,150,0,${0.2+Math.random()*0.4})`;
    x.beginPath();
    x.ellipse(Math.random()*512, Math.random()*512, 10+Math.random()*40, 10+Math.random()*30, Math.random()*Math.PI, 0, Math.PI*2);
    x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  return t;
}

function createMilkyWay() {
  const count = 10000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 800 + Math.random() * 1500;
    const theta = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 200 * Math.exp(-r/2000);
    pos[i*3] = r * Math.cos(theta); pos[i*3+1] = y * 0.4; pos[i*3+2] = r * Math.sin(theta) * 0.7;
    const t = Math.random();
    let cr, cg, cb;
    if (t < 0.4) { cr=0.85; cg=0.8; cb=1.0; }
    else if (t < 0.7) { cr=1.0; cg=0.9; cb=0.75; }
    else { cr=0.9; cg=0.95; cb=1.0; }
    col[i*3]=cr; col[i*3+1]=cg; col[i*3+2]=cb;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 2.5, vertexColors: true, transparent: true, opacity: 0.55, sizeAttenuation: true, depthWrite: false
  })));
}

    const th = Math.random() * Math.PI * 2;

    const speed = 8 + Math.random() * 12;
    pVel.push({
      x: Math.sin(ph) * Math.cos(th) * speed,
      y: Math.cos(ph) * speed,
      z: Math.sin(ph) * Math.sin(th) * speed
    });
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  supernovaParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color: 0xffaa44, size: 0.8, transparent: true, opacity: 0
  }));
  supernovaParticles.userData.vel = pVel;

      diameter:'—', distance:'خیلی دور', year:'—', day:'—', moons:'—',

    }
  };
  clickables.push(supernovaStar);

function updateSupernova(dt) {
  supernovaTimer += dt;
  if (supernovaState === 'idle' && supernovaTimer > 6) {
    supernovaState = 'explode';
    supernovaTimer = 0;
    supernovaStar.material.color.setHex(0xffffaa);
    supernovaParticles.material.opacity = 1;
    const arr = supernovaParticles.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i++) arr[i] = 0;
    supernovaParticles.geometry.attributes.position.needsUpdate = true;
  } else if (supernovaState === 'explode') {
    const arr = supernovaParticles.geometry.attributes.position.array;
    const vel = supernovaParticles.userData.vel;
    for (let i = 0; i < vel.length; i++) {
      arr[i*3]     += vel[i].x * dt * 3;
      arr[i*3+1]   += vel[i].y * dt * 3;
      arr[i*3+2]   += vel[i].z * dt * 3;
    }
    supernovaParticles.geometry.attributes.position.needsUpdate = true;
    supernovaParticles.material.opacity = Math.max(0, 1 - supernovaTimer / 2.5);
    if (supernovaTimer > 2.5) { supernovaState = 'fade'; supernovaTimer = 0; }
  } else if (supernovaState === 'fade') {
    if (supernovaTimer > 2) {
      supernovaState = 'idle';
      supernovaTimer = 0;
      supernovaStar.material.color.setHex(0xffffff);
      supernovaParticles.material.opacity = 0;
    }
  }
}

const meteors = [];
function createMeteors() {
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(20 * 3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    scene.add(line);
    const m = { line, arr: geo.attributes.position.array, x:0, y:0, z:0, vx:0, vy:0, vz:0, life:0 };
    resetMeteor(m);
    meteors.push(m);
  }
}
function resetMeteor(m) {
  const startR = 200 + Math.random() * 100;
  const startTh = Math.random() * Math.PI * 2;
  m.x = Math.cos(startTh) * startR;
  m.y = 50 + Math.random() * 100;
  m.z = Math.sin(startTh) * startR;
  const speed = 80 + Math.random() * 60;
  m.vx = -m.x / startR * speed;
  m.vy = -20 - Math.random() * 30;
  m.vz = -m.z / startR * speed;
  m.life = 100 + Math.random() * 60;
}
function updateMeteors(dt) {
  meteors.forEach(m => {
    if (m.life <= 0) resetMeteor(m);
    m.life -= dt;
    m.x += m.vx * dt; m.y += m.vy * dt; m.z += m.vz * dt;
    const L = m.arr.length / 3;
    for (let i = 0; i < L; i++) {
      const f = i / L;
      m.arr[i*3] = m.x + m.vx * f * 0.4;
      m.arr[i*3+1] = m.y + m.vy * f * 0.4;
      m.arr[i*3+2] = m.z + m.vz * f * 0.4;
    }
    m.line.geometry.attributes.position.needsUpdate = true;
    m.line.material.opacity = Math.min(1, m.life / 60);
  });
}

let isDown = false, prevX = 0, prevY = 0;
let theta = 0.5, phi = Math.PI / 3, camRadius = 60;
const INITIAL = { theta: 0.5, phi: Math.PI/3, radius: 60 };
let followMesh = null;
let camTargetX = 0, camTargetY = 0, camTargetZ = 0;

function updateCamera() {
  if (followMesh) {
    const p = new THREE.Vector3();
    followMesh.getWorldPosition(p);
    camTargetX = p.x; camTargetY = p.y; camTargetZ = p.z;
  } else {
    camTargetX += (0 - camTargetX) * 0.08;
    camTargetY += (0 - camTargetY) * 0.08;
    camTargetZ += (0 - camTargetZ) * 0.08;
  }
  camera.position.x = camTargetX + camRadius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = camTargetY + camRadius * Math.cos(phi);
  camera.position.z = camTargetZ + camRadius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(camTargetX, camTargetY, camTargetZ);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDown = true; prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('mouseup', () => isDown = false);
window.addEventListener('mousemove', e => {
  if (!isDown) return;
  theta -= (e.clientX - prevX) * 0.005;
  phi -= (e.clientY - prevY) * 0.005;
  phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camRadius += e.deltaY * 0.05;
  camRadius = Math.max(3, Math.min(400, camRadius));
}, { passive: false });

let mouseDownPos = null;
renderer.domElement.addEventListener('mousedown', e => {
  mouseDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('click', e => {
  if (!mouseDownPos) return;
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > 5) return;

  mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects([sun, ...clickables], false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj.userData.info) {
      showPlanetInfo(obj.userData.info, obj);
      zoomToObject(obj);
      unlockAchievement('explorer', obj.userData.info.name);
    }
  }
});

function zoomToObject(obj) {
  followMesh = obj;
  const p = new THREE.Vector3();
  obj.getWorldPosition(p);
  camTargetX = p.x; camTargetY = p.y; camTargetZ = p.z;
  const targetRadius = obj.userData.size ? obj.userData.size * 8 + 3 : 10;
  const startRadius = camRadius;
  const startTime = performance.now();
  function step() {
    const t = Math.min(1, (performance.now() - startTime) / 800);
    const ease = 1 - Math.pow(1 - t, 3);
    camRadius = startRadius + (targetRadius - startRadius) * ease;
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

function unlockAchievement(id, targetName) {
  if (targetName) visitedNames.add(targetName);
  if (id === 'explorer' && targetName === 'خورشید') unlock('sunLover');
  if (id === 'explorer' && (targetName === 'سرس' || targetName === 'پلوتو')) unlock('dwarfFinder');
  if (id === 'explorer' && (targetName === 'وویجر ۱' || targetName === 'وویجر ۲')) unlock('voyager');
  if (id === 'explorer' && targetName === 'سیاه‌چاله') unlock('blackHole');
  if (id === 'explorer' && targetName === 'Trappist-1') unlock('trappist');
  if (id === 'explorer' && targetName === 'ستاره ابرنواختر') unlock('supernova');
  unlock('firstVisit');
  const planetNames = [...PLANETS, ...DWARFS].map(p => p.name);
  if (planetNames.every(n => visitedNames.has(n))) unlock('explorer');
  updateAchUI();
}

  const t = document.createElement('div');
  t.className = 'ach-toast';
  t.textContent = '🏆 ' + a.title + ' — ' + a.desc;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

function nextTourStop() {
  if (!tourOn) return;
  if (tourIndex >= tourBodies.length) tourIndex = 0;
  const obj = tourBodies[tourIndex];
  if (obj && obj.userData.info) {
    showPlanetInfo(obj.userData.info, obj);
    zoomToObject(obj);
    document.getElementById('tourText').textContent = '🎥 در حال نمایش: ' + obj.userData.info.name;

  tourTimeout = setTimeout(nextTourStop, 4500);

function buildSizeCompare() {
  const content = document.getElementById('scContent');
  content.innerHTML = '';
  const all = [
    { name: 'خورشید', r: 696000, color: '#ffcc00' },
    ...PLANETS.map(p => ({ name: p.name, r: p.realR, color: '#' + p.color.toString(16).padStart(6,'0') })),
    { name: 'سرس', r: 470, color: '#998877' },
    { name: 'پلوتو', r: 1188, color: '#c8b8a0' }
  ];
  const row1 = document.createElement('div'); row1.className = 'row';
  all.filter(b => ['خورشید','مشتری','زحل'].includes(b.name)).forEach(b => row1.appendChild(buildBody(b, 0.00008)));
  content.appendChild(row1);
  const row2 = document.createElement('div'); row2.className = 'row';
  all.filter(b => ['اورانوس','نپتون','زمین','زهره','مریخ','عطارد'].includes(b.name)).forEach(b => row2.appendChild(buildBody(b, 0.00025)));
  content.appendChild(row2);
  const row3 = document.createElement('div'); row3.className = 'row';
  all.filter(b => ['پلوتو','سرس'].includes(b.name)).forEach(b => row3.appendChild(buildBody(b, 0.0012)));
  content.appendChild(row3);
}
function buildBody(b, scale) {
  const size = Math.max(20, b.r * scale);
  const wrap = document.createElement('div');
  wrap.className = 'body';
  const circle = document.createElement('div');
  circle.className = 'circle';
  circle.style.width = size + 'px';
  circle.style.height = size + 'px';
  circle.style.background = b.color;
  circle.style.color = b.color;
  wrap.appendChild(circle);
  const name = document.createElement('div'); name.className = 'name'; name.textContent = b.name;
  wrap.appendChild(name);
  const dim = document.createElement('div'); dim.className = 'dim';
  dim.textContent = b.r.toLocaleString('fa-IR') + ' km';
  wrap.appendChild(dim);
  return wrap;
}

// آزمون
const QUIZ_QUESTIONS = [
  { q: 'کدام سیاره بزرگ‌ترین کوه منظومه شمسی رو داره؟', opts: ['زمین','مریخ','مشتری','زهره'], ans: 1 },
  { q: 'داغ‌ترین سیاره کدام است؟', opts: ['عطارد','زهره','مریخ','مشتری'], ans: 1 },
  { q: 'کدام سیاره روی پهلو می‌چرخه؟', opts: ['نپتون','اورانوس','زحل','زمین'], ans: 1 },
  { q: 'بزرگ‌ترین سیاره منظومه شمسی؟', opts: ['زحل','مشتری','اورانوس','نپتون'], ans: 1 },
  { q: 'حلقه‌ی زحل از چه ساخته شده؟', opts: ['گاز','یخ و سنگ','آتش','فلز'], ans: 1 },
  { q: 'چند سیاره در منظومه شمسی داریم؟', opts: ['۷','۸','۹','۱۰'], ans: 1 },
  { q: 'کدام سیاره سریع‌ترین بادها رو داره؟', opts: ['مشتری','نپتون','زحل','زمین'], ans: 1 },
  { q: 'سیاره‌ای که به «سیاره سرخ» معروفه؟', opts: ['مریخ','مشتری','زهره','عطارد'], ans: 0 },
  { q: 'در کدام سیاره باران اسیدی می‌باره؟', opts: ['زهره','مریخ','زمین','اورانوس'], ans: 0 },
  { q: 'کدام مأموریت اولین انسان را به ماه برد؟', opts: ['وویجر','آپولو ۱۱','کاسینی','جیمز وب'], ans: 1 }
];
let quizIndex = 0, quizScore = 0;

document.getElementById('btnQuiz').onclick = () => {
  quizIndex = 0; quizScore = 0;
  document.getElementById('quiz').classList.add('open');
  renderQuiz();
};
document.getElementById('quizClose').onclick = () => {
  document.getElementById('quiz').classList.remove('open');
};

function renderQuiz() {
  const box = document.getElementById('quizBox');
  if (quizIndex >= QUIZ_QUESTIONS.length) {
    box.innerHTML = `<h2>🎉 نتیجه‌ی آزمون</h2>
      <div class="quiz-result">امتیاز شما: <b>${quizScore}</b> از ${QUIZ_QUESTIONS.length}<br><br>
      ${quizScore >= 8 ? '🏆 فوق‌العاده! فضانورد واقعی!' : quizScore >= 5 ? '👏 خوب بود!' : '📚 یه کم مطالعه کن!'}
      </div>
      <button class="sm" style="margin-top:20px;width:100%;padding:12px" id="quizAgain">🔄 دوباره</button>`;
    const again = document.getElementById('quizAgain');
    if (again) again.onclick = () => { quizIndex = 0; quizScore = 0; renderQuiz(); };
    if (quizScore >= 8) unlock('quizMaster');
    return;
  }
  const q = QUIZ_QUESTIONS[quizIndex];
  box.innerHTML = `<h2>🎓 آزمون فضایی</h2>
    <div class="quiz-q">${q.q}</div>
    ${q.opts.map((o,i) => `<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
    <div class="quiz-progress">سوال ${quizIndex+1} از ${QUIZ_QUESTIONS.length} | امتیاز: ${quizScore}</div>`;

  box.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      const chosen = parseInt(btn.dataset.i);
      const correct = q.ans;
      box.querySelectorAll('.quiz-opt').forEach((b, i) => {
        if (i === correct) b.classList.add('correct');
        else if (i === chosen && i !== correct) b.classList.add('wrong');
        b.style.pointerEvents = 'none';
      });
      if (chosen === correct) quizScore++;
      setTimeout(() => { quizIndex++; renderQuiz(); }, 1200);
    };
  });
}

// سفر در زمان
const REF_YEAR = 2026;
document.getElementById('btnTravel').onclick = function() {
  document.getElementById('timeTravel').classList.toggle('open');
  this.classList.toggle('active');
};
document.querySelectorAll('#timeTravel .presets .sm').forEach(b => {
  b.onclick = () => {
    document.getElementById('yearInput').value = b.dataset.year;
    applyTimeTravel(parseInt(b.dataset.year));
  };
});
document.getElementById('yearInput').addEventListener('change', e => {
  applyTimeTravel(parseInt(e.target.value));
});
function applyTimeTravel(year) {
  if (isNaN(year)) return;
  unlock('timeTraveler');
  const daysDiff = (year - REF_YEAR) * 365.25;
  const periods = { 'عطارد':88, 'زهره':225, 'زمین':365.25, 'مریخ':687, 'مشتری':4333, 'زحل':10759, 'اورانوس':30687, 'نپتون':60190, 'سرس':1680, 'پلوتو':90560 };
  clickables.forEach(mesh => {
    if (!mesh.userData.isPlanet) return;
    const period = periods[mesh.userData.name] || 365;
    const baseAngle = mesh.userData.baseAngle || 0;
    mesh.userData.angle = baseAngle + (daysDiff / period) * Math.PI * 2;
    mesh.position.x = Math.cos(mesh.userData.angle) * mesh.userData.dist;
    mesh.position.z = Math.sin(mesh.userData.angle) * mesh.userData.dist;
  });
}

// صدا
let audioCtx = null, audioNodes = [];
function startAmbient() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
    const g1 = audioCtx.createGain(); g1.gain.value = 0.02;
    o1.connect(g1).connect(audioCtx.destination); o1.start();
    const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.5;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.012;
    o2.connect(g2).connect(audioCtx.destination); o2.start();
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.1;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.005;
    lfo.connect(lfoGain).connect(g1.gain); lfo.start();
    audioNodes = [o1, o2, lfo, g1, g2, lfoGain];
  } catch (e) {}
}
function stopAmbient() {
  audioNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch(_) {} });
  audioNodes = [];
}

//   انیمیشن
// ============================================================
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (sun) sun.rotation.y += 0.0015 * timeScale;
  if (sunGlow) {
    sunGlow.rotation.y -= 0.001 * timeScale;
    if (sunGlow.userData.glow2) sunGlow.userData.glow2.rotation.y += 0.0008 * timeScale;
  }

  clickables.forEach(mesh => {
    if (!mesh.userData.isPlanet) return;
    const d = mesh.userData;
    d.angle += d.speed * 0.5 * timeScale;
    mesh.position.x = Math.cos(d.angle) * d.dist;
    mesh.position.z = Math.sin(d.angle) * d.dist;
    mesh.rotation.y += 0.02 * timeScale;
    if (d.moonMeshes) {
      d.moonMeshes.forEach(moon => {
        const md = moon.userData;
        md.angle += md.speed * timeScale;
        moon.position.x = Math.cos(md.angle) * md.dist;
        moon.position.z = Math.sin(md.angle) * md.dist;
        moon.rotation.y += 0.03 * timeScale;
      });
    }
    if (mesh.userData.trail) {
      const t = mesh.userData.trail;
      const wp = new THREE.Vector3();
      mesh.getWorldPosition(wp);
      t.userData.positions.push(wp.clone());
      if (t.userData.positions.length > 100) t.userData.positions.shift();
      const arr = t.geometry.attributes.position.array;
      const pos = t.userData.positions;
      for (let i = 0; i < 100; i++) {
        const p = pos[Math.min(i, pos.length - 1)] || wp;
        arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
      }
      t.geometry.attributes.position.needsUpdate = true;
      t.geometry.setDrawRange(0, pos.length);
    }
  });

  probes.forEach(p => {
    const d = p.userData;
    if (d.outward) {
      d.angle += d.speed * timeScale;
      d.radius += d.outward * timeScale * 0.05;
      p.position.x = Math.cos(d.angle) * d.radius;
      p.position.z = Math.sin(d.angle) * d.radius;
      p.position.y = Math.sin(d.angle * 1.7) * 4;
      p.rotation.y = -d.angle;
      if (d.radius > 200) d.radius = 45;
    } else if (d.isJWST) {
      d.angle += d.speed * timeScale;
      p.position.x = 80 + Math.cos(d.angle) * d.radius;
      p.position.z = -50 + Math.sin(d.angle) * d.radius;
    } else if (d.isCassini) {
      d.angle += d.speed * timeScale;
      p.position.x = Math.cos(d.angle) * d.dist;
      p.position.z = Math.sin(d.angle) * d.dist;
    } else if (d.isApollo) {
      d.angle += d.speed * timeScale;
      p.position.x = Math.cos(d.angle) * d.radius;
      p.position.z = Math.sin(d.angle) * d.radius;
    }
  });

  if (iss) {
    const d = iss.userData;
    d.angle += d.speed * 0.02 * timeScale;
    iss.position.x = Math.cos(d.angle) * d.dist;
    iss.position.z = Math.sin(d.angle) * d.dist;
    iss.rotation.y = -d.angle;
  }

  if (accretionDisk) accretionDisk.rotation.z += 0.01 * timeScale;

  binaryStars.forEach(g => {
    const d = g.userData;
    d.angle += d.speed * timeScale;
    d.s1.position.x = Math.cos(d.angle) * d.radius;
    d.s1.position.z = Math.sin(d.angle) * d.radius;
    d.s2.position.x = -Math.cos(d.angle) * d.radius;
    d.s2.position.z = -Math.sin(d.angle) * d.radius;
    d.light1.position.copy(d.s1.position);
    d.light2.position.copy(d.s2.position);
  });

  if (trappist) {
    trappist.planets.forEach(p => {
      p.userData.angle += p.userData.speed * timeScale;
      p.position.x = Math.cos(p.userData.angle) * p.userData.dist;
      p.position.z = Math.sin(p.userData.angle) * p.userData.dist;
    });
  }

  updateSupernova(dt * timeScale);
  updateMeteors(dt * timeScale);

  if (comet) {
    const d = comet.userData;
    d.angle += d.speed * timeScale;
    const x = Math.cos(d.angle) * d.a;
    const z = Math.sin(d.angle) * d.b;
    const y = Math.sin(d.angle * 2) * 5;
    comet.position.set(x, y, z);
    d.tailHistory.push(new THREE.Vector3(x, y, z));
    if (d.tailHistory.length > d.tailLength) d.tailHistory.shift();
    const arr = cometTail.geometry.attributes.position.array;
    for (let i = 0; i < d.tailLength; i++) {
      const p = d.tailHistory[Math.min(i, d.tailHistory.length - 1)];
      arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
    }
    cometTail.geometry.attributes.position.needsUpdate = true;
    cometTail.geometry.setDrawRange(0, d.tailHistory.length);
  }

  updateCamera();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
